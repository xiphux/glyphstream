# Build + publish Docker images to GitHub Container Registry.
#
# Tag schemes:
#   - Push to main:        `main` (rolling) + `sha-<7chars>` (immutable per commit)
#   - Push tag vX.Y.Z:     `X.Y.Z`, `X.Y`, `X`, `latest`  + GitHub Release whose
#                          notes are the tag's CHANGELOG.md section
#
# Multi-arch (linux/amd64 + linux/arm64) so the same image works on x86
# hosts and Synology / Raspberry Pi-class ARM boxes. Uses GitHub's native
# ARM runners (`ubuntu-22.04-arm`) per architecture rather than QEMU
# emulation — modern Node + QEMU has known instability that crashes
# mid-build.
# Each arch builds a digest-only image, then a merge job stitches them
# into a single multi-arch manifest with the canonical tags. Tags appear
# atomically: consumers never see a half-published `latest`.
name: Docker

on:
  push:
    branches: [main]
    # Not `v*.*.*`, which also matches `v1.0.0-rc.1`. Prereleases are not
    # supported (see scripts/changelog.mjs), so such a tag could only start a
    # run it can never finish.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false # never abort a release mid-publish

# Read-only by default; `packages: write` is granted only to the two jobs that
# push to GHCR, so it never reaches the test suite behind `tests`.
permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Gate everything on the full test suite. Reusable workflow so the
  # test definition lives in one place; appears as nested sub-jobs in
  # the GitHub UI and short-circuits build/merge/release on any failure.
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # The called workflow's `gate` declares `actions: read` to look up
      # earlier runs, and a called workflow is CAPPED by the calling job. A
      # declared permission the caller does not grant is not a silent
      # downgrade -- it is a hard validation error, "the nested job 'gate' is
      # requesting 'actions: read', but is only allowed 'actions: none'",
      # which rejects the whole file before any job starts.
      actions: read

  build:
    name: Build (${{ matrix.platform }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one check that reads the TAG, and the reason it cannot live in
      # ci.yml: `gate` there inherits a pass by CONTENT, and the same tree can
      # be tagged anything, so a tag check behind it is meaningless -- on a tag
      # whose commit already went green, every ci.yml job is skipped.
      #
      # The unit tests cover the realistic slip (bumping package.json without
      # renaming `## Unreleased`) because they run on the main push and assert
      # against package.json's version. What nothing covers is the tag and the
      # manifest DISAGREEING -- tagging v0.39.1 while package.json says 0.39.0.
      # That passes every check and inherits a green run.
      #
      # In `build` rather than `merge`, where it started: `merge` applies the
      # tags, but `build` has already pushed both architectures' digest-only
      # blobs by then. Failing here means nothing reaches the registry at all.
      # It costs a second, twice, on tag pushes only.
      - name: The tag has a changelog section
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/changelog.mjs release "$TAG" > /dev/null

      # Slugify the platform string for filenames ("linux/amd64" → "linux-amd64").
      - name: Prepare platform pair
        id: prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # We don't apply tags here — the merge job below tags the final
      # multi-arch manifest. Per-arch builds get a labels-only metadata
      # pass to populate OCI annotations (org.opencontainers.image.*).
      - name: Compute labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # `push-by-digest=true` writes the image to the registry
          # without applying any tag. The merge job stitches both
          # arch digests under the canonical tag set.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # GHA cache shared per-arch (separate keys) so amd64 + arm64
          # don't fight over the same cache entries.
          cache-from: type=gha,scope=build-${{ steps.prepare.outputs.pair }}
          cache-to: type=gha,mode=max,scope=build-${{ steps.prepare.outputs.pair }}

      # Step outputs go through `env:`, not `${{ }}` inside the script:
      # an expression is pasted into the shell source before bash parses it.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.prepare.outputs.pair }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the actual tag set for this trigger:
      #   - branch=main pushes ⇒ `main` + `sha-<7chars>`
      #   - vX.Y.Z tag pushes  ⇒ `X.Y.Z`, `X.Y`, `X`, `latest`
      - name: Compute Docker tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Stitch the per-arch digests into a single multi-arch manifest
      # with all the computed tags. `imagetools create` is atomic — every
      # tag updates simultaneously when the command returns.
      - name: Create manifest list + push tags
        working-directory: /tmp/digests
        run: |
          # Word splitting is the point: one `-t tag` / `image@digest` per word.
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for d in *; do printf '%s@sha256:%s ' "$REGISTRY_IMAGE" "$d"; done)

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"

  release:
    # Only on a vX.Y.Z tag push, and only after tests + build + merge succeeded.
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the notes link to the previous release, and
          # the script checks that tag exists before linking a compare view.
          fetch-depth: 0

      # Notes come from CHANGELOG.md, NOT GitHub's `generate_release_notes`,
      # which lists pull requests only. Work here lands as direct commits to
      # main and the only PRs are Renovate bumps, which the now-deleted
      # .github/release.yml excluded by label -- so every candidate was filtered
      # out and 105 of the first 106 releases published an empty "What's Changed".
      #
      # The script exits non-zero when the tag has no CHANGELOG.md section, so a
      # release that would have said nothing fails here instead of publishing.
      # Needs no pnpm install: it imports nothing outside node: builtins.
      - name: Build release body
        run: |
          node scripts/changelog.mjs release "$TAG" > "$RUNNER_TEMP/notes.md"
          # Belt and braces: the script already exits non-zero on a missing
          # section, but nothing else checks the file it wrote, and an empty
          # body_path publishes an empty release rather than failing.
          test -s "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/notes.md

  # Report-only vulnerability scan of the image this push just published, so
  # the Security tab reflects `main` as of each merge rather than as of the
  # last weekly run. Deliberately not a dependency of `release`, and it never
  # fails the run: see image-scan.yml for why. Tag pushes skip it — a release
  # tag points at a commit whose `main` image was already scanned.
  scan:
    name: Image scan
    if: github.ref == 'refs/heads/main'
    needs: merge
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/image-scan.yml
    with:
      tag: main
