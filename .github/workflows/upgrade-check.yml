# Weekly upgrade to-do list, as GitHub issues rather than PRs:
#
#   - One open issue per available npm MAJOR upgrade (scripts/major-upgrade-issues.mjs),
#     closed once the lockfile is on the latest major. Dependabot ignores npm
#     majors (see dependabot.yml): it proposes only a package's newest version,
#     so a pending major would replace that package's minor and patch updates,
#     and every held major would also occupy one of its five open-PR slots.
#   - One issue when either aliased TypeScript compiler has a newer release
#     (scripts/typescript-release-issue.mjs). Dependabot and `pnpm outdated`
#     both skip npm aliases, so nothing else would notice.
#
# Runs from the default branch on a schedule, and checks out nothing but this
# repo's own trusted code.
name: Upgrade check

on:
  schedule:
    - cron: '0 14 * * 1' # 14:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      # `pnpm outdated` reads installed versions, and the scripts import `yaml`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `pnpm outdated` exits 1 whenever anything is outdated, which is the
      # normal case, so its status is not the signal; an empty or unreadable
      # report is, and the script fails on that.
      - name: List outdated packages
        run: pnpm outdated --format json > "$RUNNER_TEMP/outdated.json" || true

      - name: Open, update and close major-upgrade issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/major-upgrade-issues.mjs "$RUNNER_TEMP/outdated.json"

      - name: Report TypeScript compiler releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/typescript-release-issue.mjs
