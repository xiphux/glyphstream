# GlyphStream CI — runs static analysis, workflow + Dockerfile lint, a secret
# scan, a Docker image boot smoke, and unit + e2e tests.
#
# Triggers:
#   - Direct on push to any branch except `main`, Dependabot's, and tags.
#     Feature-branch pushes get fast feedback without a Docker build
#     piggy-backing. Dependabot branches are excluded because every one
#     has a PR: the push run would duplicate the `pull_request` run on the
#     same commit (different concurrency groups, so neither cancels), and
#     only the `pull_request` run is read by dependabot-automerge.yml.
#   - Direct on every PR. Drives the PR checks UI.
#   - Indirect via `workflow_call` from docker.yml on `main` pushes
#     and `v*.*.*` tags, so the docker build/publish + GitHub release
#     are explicitly gated on tests passing.
#
# This split avoids running tests twice on `main` pushes (which would
# happen if both this workflow's `push` trigger AND docker.yml's
# trigger fired on the same commit).
#
# It does NOT avoid running them twice across a release: the `main` push
# and the `vX.Y.Z` tag that later points at that same commit are two
# separate events over identical trees. The `gate` / `record-pass` pair
# closes that gap — a full green run writes a marker keyed on the commit
# SHA, and a later run on the same SHA skips straight to the end. Under
# `workflow_call` the `github` context is the CALLER's, so the tag run
# and the `main` run agree on `github.sha`, which is the whole trick.
# (On `pull_request`, `github.sha` is the ephemeral merge commit, so PRs
# never match a branch run's marker — they always test for real.)
name: CI

on:
  push:
    branches-ignore: [main, 'dependabot/**']
    tags-ignore: ['**']
  pull_request:
  workflow_call:

# Only run one CI per branch at a time — cancel any in-flight runs
# when a new commit lands so we're not paying for stale results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo or a registry; the pass marker is an Actions
# cache entry, which rides the runtime token rather than GITHUB_TOKEN. Under
# `workflow_call` this also caps what docker.yml's grant can reach in here.
permissions:
  contents: read

jobs:
  # Has this exact commit already gone green? `lookup-only` probes for the
  # marker without downloading it, so this costs one short runner start.
  #
  # Cache visibility is what makes this work across the release boundary:
  # a run on `refs/tags/v*` can restore caches written on the default
  # branch. That's the same rule the Docker layer cache already leans on.
  #
  # This job has no `if:` and must not fail. That matters — it's the only
  # job left running on a marker hit, and a called workflow whose jobs are
  # ALL skipped concludes as skipped, which would in turn skip docker.yml's
  # `build`/`merge`. One unconditional success keeps the conclusion green.
  # `continue-on-error` on the probe is belt-and-braces, mirroring the save
  # step below. `actions/cache` swallows a cache-service outage as a warning
  # and returns no match, so it very likely wouldn't fail `gate` on its own —
  # but if any probe failure ever did surface as a step failure, it would skip
  # every check job and fail the called workflow, turning a broken
  # optimization into a blocked release. Any non-`'true'` outcome (miss or
  # error) already means "not passed" to every consumer of this output.
  #
  # When this actually fires: only once the `main` run's TEST jobs have
  # finished, since `record-pass` writes the marker immediately after them —
  # note that's well before the `main` run itself ends, which waits on the
  # Docker build and merge. Tagging while those tests are still going
  # (`git push --follow-tags`, or tagging straight after the push) simply
  # misses and runs the full suite. Most releases in this repo's history
  # clear that bar, but several by under a minute, so treat it as a race you
  # can lose rather than a guarantee — and don't go debugging a "broken"
  # gate that was only ever racing.
  #
  # Staleness: the marker asserts "same tree, same lockfile", not "same
  # toolchain" — `ubuntu-latest` and `node-version: '26'` (newest 26.x) drift, so
  # a very old marker vouches for an environment that no longer exists.
  # GitHub evicts caches untouched for 7 days, which caps that drift window
  # without any date-bucketing in the key.
  #
  # "Re-run all jobs" on an already-green run hits its own marker and skips
  # the suite — a real capability this costs you. To force a genuine re-test,
  # delete the marker:
  #   gh cache delete ci-pass-<full-sha>-v1 --ref refs/heads/main
  # (the full 40-char sha, NOT the `sha-<7chars>` form docker.yml tags images
  # with), then re-run. Bumping `-v1` does not do it: the key names a commit,
  # and every run able to read one resolves this file from that same commit —
  # push and tag runs use the workflow at the event's SHA, a `./…` reusable
  # workflow is "from the same commit as the caller", and a re-run keeps the
  # original `GITHUB_SHA`. A bump therefore renames a key nothing was going
  # to read, and the re-run still executes the OLD ci.yml. Treat the suffix
  # as a key-shape reset, not a cache-buster — it would only start busting if
  # this workflow gained a trigger that decouples `github.sha` from the
  # workflow file's commit (`release`, `deployment`).
  gate:
    name: Check for a recorded pass
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - name: Probe for a pass marker
        id: probe
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ci-pass-${{ github.sha }}-v1
          lookup-only: true

  # Lint, type-check, formatting and the migration check share one job
  # rather than several: each takes well under a minute, and they'd otherwise
  # each pay the ~40s checkout + install to run in parallel.
  # `continue-on-error` is NOT set on any of them — all of them gate the PR.
  # (The two uses of it in this file are both on cache bookkeeping, never on
  # a check.)
  static:
    name: Lint + type-check + format + migrations
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The major the Docker image ships (node:26-alpine), so CI tests the
          # runtime production runs rather than whatever is newest. '26' still
          # tracks the newest 26.x, like the image tag. Bump both together.
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native modules
        run: pnpm rebuild esbuild

      # Independent checks, so `if: always()` keeps a formatting nit from
      # hiding a type error (and vice versa) — one run reports all three.
      - name: Type-check
        run: pnpm check

      - name: Lint
        if: always()
        run: pnpm lint

      - name: Format
        if: always()
        run: pnpm format:check

      # schema.ts and the committed migrations must agree. A schema edit
      # committed without its migration leaves `generate` with work to do, and
      # the runtime migrator only applies what's in drizzle/, so the app would
      # boot against tables the code no longer matches: fresh test DBs build
      # from drizzle/ and pass too. Needs no database; generate diffs the schema
      # against drizzle/'s snapshots. A new or changed file under drizzle/
      # after running it is the failure.
      - name: Migrations match schema
        if: always()
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "::error::schema.ts and drizzle/ disagree. Run pnpm db:generate and commit the migration it writes."
            exit 1
          fi

  # Its own job rather than steps in `static`: it needs no pnpm install, so it
  # finishes in seconds and doesn't wait behind one. actionlint catches
  # workflow mistakes (bad expressions, `needs` typos, shellcheck in `run:`);
  # zizmor catches security ones (unpinned actions, injection, permissions);
  # hadolint catches Dockerfile ones. Each tool's intentional exceptions live
  # in its config (.github/zizmor.yml, .hadolint.yaml), with reasons.
  infra:
    name: Workflow + Dockerfile lint
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary from GitHub, checksum-pinned, not the Docker Hub
      # image: this job gates merges and releases, and anonymous Docker Hub pulls
      # are rate-limited per IP on runners shared with everyone else. It checks
      # `run:` scripts with the runner image's preinstalled shellcheck. Bump
      # the version and checksum together (from the release's checksums.txt).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Online audits use the job's read-only token to verify that each SHA pin
      # is a real commit of the named repo and matches its `# vX.Y.Z` comment.
      # Annotations instead of SARIF upload: no `security-events: write` needed.
      # The action only runs zizmor versions in its own table (pulled by digest),
      # so `version` must be one the pinned action release knows: bumping zizmor
      # past it fails with "Unknown version" until the action is bumped too.
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

      # Picks up .hadolint.yaml from the mounted repo root. Pinned by digest, and
      # pulled from GHCR rather than Docker Hub for the same reason as actionlint.
      - name: hadolint
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint Dockerfile

  # Backstop for the pre-commit hook, which only runs where gitleaks is
  # installed and is skipped by `--no-verify`. Scans the full history of the
  # commit under test, not just the new commits: at this repo's size the scan
  # takes about a second, and it needs no base-ref logic that differs between
  # push, PR and workflow_call.
  # Reviewed false positives: .gitleaksignore (history) and inline
  # `gitleaks:allow` (current tree).
  # Build the runtime image and boot it. Everything else in CI runs a full dev
  # install on glibc; the image installs `--prod --ignore-scripts` on
  # Alpine/musl. A runtime dependency missing from `dependencies`, a musl
  # prebuilt that won't load (sharp), or a package whose entry point moved
  # passes every other job and breaks the shipped image, and Dependabot
  # auto-merges before docker.yml ever builds. tests/image-smoke/run.sh boots
  # the container on a fresh DB, renders a page, and has smoke.mjs do real work
  # with each runtime dependency from the image's own node_modules. Runnable
  # locally the same way.
  #
  # amd64 only: the arm64 image is the same Dockerfile and lockfile, and an
  # arm64 runner would double the cost for the rare arm-only packaging break.
  #
  # Cache: reads docker.yml's main-branch layer cache (build-linux-amd64) so a
  # warm build is quick, but writes only to its own scope, so a PR run can
  # never feed layers into the image docker.yml publishes.
  image:
    name: Docker image smoke
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build runtime image (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: glyphstream:ci-smoke
          cache-from: |
            type=gha,scope=build-linux-amd64
            type=gha,scope=ci-image-smoke
          cache-to: type=gha,mode=max,scope=ci-image-smoke

      - name: Boot and smoke-test the image
        run: tests/image-smoke/run.sh glyphstream:ci-smoke

  secrets:
    name: Secret scan
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pinned by digest; bump the tag and digest together. --redact keeps a
      # real hit out of the (public) job log. --log-opts=HEAD scans the history
      # of the commit under test only: gitleaks defaults to `git log --all`,
      # and fetch-depth 0 fetches every remote branch, so a finding on some
      # stale, unrelated branch would otherwise fail every PR and block main
      # publishes over a commit that doesn't contain it. (GitHub's own secret
      # scanning still covers the whole repo.)
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --no-banner --verbose --log-opts=HEAD

  unit:
    name: Unit tests
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: pnpm

      # --ignore-scripts: pnpm blocks unapproved native-module
      # builds in CI even when pnpm-workspace.yaml's `allowBuilds` lists
      # them. Rebuild explicitly afterward — that's the documented bypass.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native modules
        run: pnpm rebuild esbuild

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native modules
        run: pnpm rebuild esbuild

      # Cache Playwright browser binaries across runs. Keyed on the
      # version string from the installed @playwright/test so the
      # cache invalidates when the package bumps; rehydrates for free
      # otherwise.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # On a cache hit, browser binaries are present but the apt-get
      # system deps might not be — install just those.
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      # On failure, attach the Playwright HTML report + traces so the
      # PR author can debug without re-running locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Write the marker only once every gating job is green. The `if:`
  # carries no status-check function, so the implicit "every `needs` must
  # have succeeded" still applies — one red job and no marker is written.
  # Cost, on the `main`-push path: a reusable workflow is complete only when
  # ALL its jobs terminate, so this job sits between the tests finishing and
  # docker.yml's `build` starting — as `gate` does at the front. (Measured on
  # the old graph: `build` started 2s after the *slowest* test job, not the
  # first.) That's two runner starts' worth of publish latency on every `main`
  # push, order of tens of seconds — an estimate from runner-provision
  # overhead, not a measurement, since neither job has run in CI yet. Paid
  # back many times over on the tag run it lets skip the suite outright.
  #
  # Restricted to `main` because that is the ONLY scope whose marker anything
  # can read. A run reads its own ref's cache scope plus the default branch's,
  # never a sibling's — so a marker written from a feature branch, a PR (where
  # `github.sha` is the ephemeral `refs/pull/N/merge` commit anyway), or a tag
  # ref is unreadable by the `main`/tag pair this exists to serve. Every one of
  # those writes would be a runner start at the tail of the run to record a
  # pass nothing can ever read — and every Dependabot update would pay it on
  # its PR run. Under `workflow_call` the `github` context is the
  # caller's, so `main` pushes still record normally; the tag run reads.
  record-pass:
    name: Record pass
    needs: [gate, static, infra, secrets, image, unit, e2e]
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write marker
        run: touch .ci-pass

      # `continue-on-error` because this job is inside the reusable workflow
      # that docker.yml's build/merge/release hang off. A failed cache upload
      # would otherwise fail `tests` and block a publish over a bookkeeping
      # step whose only consequence is that the next run re-tests. The
      # optimization is allowed to be unavailable; it isn't allowed to be a
      # new way for a release to break.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: .ci-pass
          key: ci-pass-${{ github.sha }}-v1
