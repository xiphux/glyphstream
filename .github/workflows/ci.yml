# GlyphStream CI — runs static analysis, workflow + Dockerfile lint, a secret
# scan, a Docker image boot smoke, and unit + e2e tests.
#
# Triggers:
#   - Direct on push to any branch except `main`, Dependabot's, and tags.
#     Feature-branch pushes get fast feedback without a Docker build
#     piggy-backing. Dependabot branches are excluded because every one
#     has a PR: the push run would duplicate the `pull_request` run on the
#     same commit (different concurrency groups, so neither cancels), and
#     only the `pull_request` run is the one that gates a merge.
#   - Direct on every PR. Drives the PR checks UI.
#   - Indirect via `workflow_call` from docker.yml on `main` pushes
#     and `v[0-9]+.[0-9]+.[0-9]+` tags, so the docker build/publish + GitHub release
#     are explicitly gated on tests passing.
#
# This split avoids running tests twice on `main` pushes (which would
# happen if both this workflow's `push` trigger AND docker.yml's
# trigger fired on the same commit).
#
# Two duplicates remain after that split, and `gate` below removes both:
# the `main` push that merges a pull request re-checks what the pull
# request just checked, and the `vX.Y.Z` tag that later points at that same
# commit checks it a third time.
name: CI

on:
  push:
    # renovate/** alongside dependabot/**: a bot branch lives in this
    # repository, so a push to it and the PR it opens would each run this
    # workflow over the same tree -- every check reported, and paid for,
    # twice. The PR run is the one that matters; it tests the merge with main.
    branches-ignore: [main, 'dependabot/**', 'renovate/**']
    tags-ignore: ['**']
  pull_request:
  workflow_call:

# Only run one CI per branch at a time — cancel any in-flight runs
# when a new commit lands so we're not paying for stale results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo or a registry. `gate` asks for `actions:
# read` on its own, to look up earlier runs. Under `workflow_call` this also
# caps what docker.yml's grant can reach in here.
permissions:
  contents: read

jobs:
  # Has this exact content already gone green somewhere else? If so every
  # check below skips, because running them again would test the same bytes
  # a second time.
  #
  # Two ways that can be true, tried in order:
  #
  #   (1) THE SAME COMMIT — a release tag points at the commit `main` was
  #       already pushed with, so the run that checked `main` checked this.
  #       Identical SHA is the strongest evidence there is.
  #   (2) THE SAME TREE — on a `main` push, HEAD is the merge commit and its
  #       second parent is the branch that merged. Equal trees mean
  #       byte-identical checkouts, and prove the branch was up to date when
  #       it merged, so the combination was tested.
  #
  # They compose without overlapping: on a `main` push (1) finds nothing,
  # because a pull_request run reports the BRANCH head as its `head_sha`
  # rather than the merge commit, so it falls through to (2). On a tag (1)
  # answers at once.
  #
  # This replaces a marker in the Actions cache written by a `record-pass`
  # job. That covered (1) only, and could never cover (2): a cache written
  # by a `pull_request` run belongs to `refs/pull/N/merge` and, per GitHub's
  # documentation, "can only be restored by re-runs of the pull request", so
  # `main` could not read it. An API lookup by `head_sha` has no such
  # scoping. The cache version was also stricter in one respect worth
  # recording -- `record-pass` wrote only when the checks had really run, so
  # a marker never represented an inherited pass. Here a tag's pass can
  # trace back through `main` to the pull request. Every link is the same
  # content, tree-identical then SHA-identical, so the pass is sound; it
  # means "some run executed these checks against these bytes" rather than
  # "a run executed them at this ref".
  #
  # THE INVARIANT THAT MATTERS: at least one job in this workflow must not
  # skip. A called workflow whose jobs ALL skip concludes as *skipped*, and
  # docker.yml's `build` and `merge` hang off `needs: tests`, so that would
  # skip the Docker build and turn a release into a green run that shipped
  # nothing. It cannot happen: the checks skip only when `passed == 'true'`,
  # and only a job that RAN can emit that. So if `gate` skips, the checks
  # run; if it runs, it is itself the non-skipped job.
  #
  # Guarded at two levels, because the keys differ in scope.
  # `continue-on-error` on the STEP stops a failed lookup -- a network error,
  # an unparseable response -- from failing the job. The same key on the JOB
  # stops a job-level death, in practice a runner that never allocates, from
  # failing the run. Neither bounds queue time: `timeout-minutes` does not
  # start until a runner picks the job up. Nothing depends on this job
  # finishing usefully -- the checks run regardless, via `!cancelled()`.
  #
  # Re-runs re-check for real: the script declines to inherit on attempt 2
  # and above. The cache version lost that -- "Re-run all jobs" hit its own
  # marker and skipped the suite, and forcing a genuine re-test meant
  # deleting the cache entry by hand.
  #
  # Staleness: an inherited pass asserts "identical content", not "identical
  # toolchain". `ubuntu-latest` and `node-version: '26'` drift, so a pass
  # earned long ago vouches for an environment that has moved. The window is
  # normally minutes for a merge; for a tag it is however long sits between
  # the merge and the release.
  gate:
    name: Check for an earlier pass
    # main and tags only, and NOT pull requests. On a pull_request event the
    # checkout is the merge ref -- itself a merge commit whose second parent
    # is the branch head -- so lookup (2) below would compare a tree against
    # the very branch being tested and look up that branch's own runs. A pull
    # request must never be able to certify itself.
    #
    # Because this job can now skip, every check below carries `!cancelled()`.
    # Without it a skipped `gate` would skip the whole suite: a plain
    # expression does not override the implicit success-gating that a skipped
    # dependency imposes, and the checks would silently stop running on
    # exactly the event they matter most for.
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
      # For the run lookups below.
      actions: read
    outputs:
      passed: ${{ steps.inherit.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents is all lookup (2) needs. If a
          # fetch ever comes back without the second parent, `rev-parse` fails
          # and the step falls through to running the checks.
          fetch-depth: 2
          persist-credentials: false

      - name: Inherit a pass this content already earned
        id: inherit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Two different workflows, because this one never has a run of its
          # own on main or a tag -- docker.yml calls it, and a called workflow
          # runs inside the caller's run. So the branch/tag evidence is a
          # docker.yml run, while the pull-request evidence is a ci.yml run.
          SAME_SHA_WORKFLOW: .github/workflows/docker.yml
          PR_WORKFLOW: .github/workflows/ci.yml
        run: |
          set -euo pipefail

          # A re-run is somebody asking for these checks to actually run.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            echo "Attempt ${GITHUB_RUN_ATTEMPT:-1}: re-checking rather than inheriting."
            exit 0
          fi

          # jq reads the names from the environment rather than having them
          # spliced into the program, so a value can never be parsed as jq.
          runs_for () {
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$1&per_page=100" \
              --jq "$2"
          }

          # Each lookup either sets `reason` or bows out, so there is exactly
          # one line below that can report a pass, however many ways there
          # are to earn one.
          reason=""

          # (1) THE SAME COMMIT. A release tag points at the commit main was
          # already pushed with, so the run that checked main checked this.
          # Identical SHA is the strongest evidence there is. Excludes this
          # run, which is in that list too and is not evidence about itself.
          # shellcheck disable=SC2016
          # The single quotes are the point: `$ENV.…` must reach jq
          # unexpanded, so that jq reads the value from the environment. A
          # shell expansion here would splice the value into the program
          # text instead, which is both wrong and the shape an injection
          # would take.
          same_sha=$(runs_for "${GITHUB_SHA}" '
            [.workflow_runs[]
             | select(.path == $ENV.SAME_SHA_WORKFLOW
                      and (.id | tostring) != $ENV.GITHUB_RUN_ID)]
            | sort_by(.run_started_at) | last | .conclusion // empty')

          if [ "${same_sha}" = "success" ]; then
            reason="${GITHUB_SHA} has already been checked by an earlier run"
          else
            # (2) THE SAME TREE. On a push to main, HEAD is the merge commit
            # and its second parent is the branch that merged. Equal trees
            # mean byte-identical checkouts, and also prove the branch was up
            # to date when it merged -- a branch that was behind would have
            # pulled main's commits into this tree and changed the hash.
            if ! pr_head=$(git rev-parse -q --verify 'HEAD^2'); then
              echo "No earlier run for ${GITHUB_SHA}, and HEAD is not a merge commit."
              exit 0
            fi

            head_tree=$(git rev-parse 'HEAD^{tree}')
            pr_tree=$(git rev-parse "${pr_head}^{tree}")

            if [ "${head_tree}" != "${pr_tree}" ]; then
              echo "Tree ${head_tree} differs from ${pr_head}'s ${pr_tree}."
              echo "The merge combined two lines nothing has tested together."
              exit 0
            fi

            # shellcheck disable=SC2016
            # The single quotes are the point: `$ENV.…` must reach jq
            # unexpanded, so that jq reads the value from the environment. A
            # shell expansion here would splice the value into the program
            # text instead, which is both wrong and the shape an injection
            # would take.
            same_tree=$(runs_for "${pr_head}" '
              [.workflow_runs[]
               | select(.path == $ENV.PR_WORKFLOW
                        and .event == "pull_request")]
              | sort_by(.run_started_at) | last | .conclusion // empty')

            if [ "${same_tree}" != "success" ]; then
              echo "No successful run for ${pr_head} (got: ${same_tree:-none})."
              exit 0
            fi

            reason="the tree is identical to ${pr_head}, whose checks passed"
          fi

          echo "Inheriting: ${reason}."
          echo "passed=true" >> "${GITHUB_OUTPUT}"

  # Lint, type-check, formatting and the migration check share one job
  # rather than several: each takes well under a minute, and they'd otherwise
  # each pay the ~40s checkout + install to run in parallel.
  # `continue-on-error` is NOT set on any of them — all of them gate the PR.
  # (The two uses of it in this file are both on cache bookkeeping, never on
  # a check.)
  static:
    name: Lint + type-check + format + migrations
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The major the Docker image ships (node:26-alpine), so CI tests the
          # runtime production runs rather than whatever is newest. '26' still
          # tracks the newest 26.x, like the image tag. Bump both together.
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native modules
        run: pnpm rebuild esbuild

      # Independent checks, so `if: always()` keeps a formatting nit from
      # hiding a type error (and vice versa) — one run reports all three.
      - name: Type-check
        run: pnpm check

      - name: Lint
        if: always()
        run: pnpm lint

      - name: Format
        if: always()
        run: pnpm format:check

      # schema.ts and the committed migrations must agree. A schema edit
      # committed without its migration leaves `generate` with work to do, and
      # the runtime migrator only applies what's in drizzle/, so the app would
      # boot against tables the code no longer matches: fresh test DBs build
      # from drizzle/ and pass too. Needs no database; generate diffs the schema
      # against drizzle/'s snapshots. A new or changed file under drizzle/
      # after running it is the failure.
      - name: Migrations match schema
        if: always()
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "::error::schema.ts and drizzle/ disagree. Run pnpm db:generate and commit the migration it writes."
            exit 1
          fi

  # Its own job rather than steps in `static`: it needs no pnpm install, so it
  # finishes in seconds and doesn't wait behind one. actionlint catches
  # workflow mistakes (bad expressions, `needs` typos, shellcheck in `run:`);
  # zizmor catches security ones (unpinned actions, injection, permissions);
  # hadolint catches Dockerfile ones. Each tool's intentional exceptions live
  # in its config (.github/zizmor.yml, .hadolint.yaml), with reasons.
  infra:
    name: Workflow + Dockerfile lint
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary from GitHub, checksum-pinned, not the Docker Hub
      # image: this job gates merges and releases, and anonymous Docker Hub pulls
      # are rate-limited per IP on runners shared with everyone else. It checks
      # `run:` scripts with the runner image's preinstalled shellcheck. Bump
      # the version and checksum together (from the release's checksums.txt).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Online audits use the job's read-only token to verify that each SHA pin
      # is a real commit of the named repo and matches its `# vX.Y.Z` comment.
      # Annotations instead of SARIF upload: no `security-events: write` needed.
      # The action only runs zizmor versions in its own table (pulled by digest),
      # so `version` must be one the pinned action release knows: bumping zizmor
      # past it fails with "Unknown version" until the action is bumped too.
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

      # Picks up .hadolint.yaml from the mounted repo root. Pinned by digest, and
      # pulled from GHCR rather than Docker Hub for the same reason as actionlint.
      - name: hadolint
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint Dockerfile

      # CHANGELOG.md is the sole source of release notes, so a malformed one is
      # a release that publishes nothing -- which is what docker.yml did for 105
      # releases before this. Checks the structure only (headings are Unreleased
      # or vX.Y.Z, newest first, no released version left empty); whether an
      # entry is WORTH writing is a review question, not a CI one. Lives here
      # rather than in `static` because it needs no pnpm install.
      - name: Changelog
        if: ${{ !cancelled() }}
        run: node scripts/changelog.mjs validate

  # Backstop for the pre-commit hook, which only runs where gitleaks is
  # installed and is skipped by `--no-verify`. Scans the full history of the
  # commit under test, not just the new commits: at this repo's size the scan
  # takes about a second, and it needs no base-ref logic that differs between
  # push, PR and workflow_call.
  # Reviewed false positives: .gitleaksignore (history) and inline
  # `gitleaks:allow` (current tree).
  # Build the runtime image and boot it. Everything else in CI runs a full dev
  # install on glibc; the image installs `--prod --ignore-scripts` on
  # Alpine/musl. A runtime dependency missing from `dependencies`, a musl
  # prebuilt that won't load (sharp), or a package whose entry point moved
  # passes every other job and breaks the shipped image, and Dependabot
  # auto-merges before docker.yml ever builds. tests/image-smoke/run.sh boots
  # the container on a fresh DB, renders a page, and has smoke.mjs do real work
  # with each runtime dependency from the image's own node_modules. Runnable
  # locally the same way.
  #
  # amd64 only: the arm64 image is the same Dockerfile and lockfile, and an
  # arm64 runner would double the cost for the rare arm-only packaging break.
  #
  # Cache: reads docker.yml's main-branch layer cache (build-linux-amd64) so a
  # warm build is quick, but writes only to its own scope, so a PR run can
  # never feed layers into the image docker.yml publishes.
  image:
    name: Docker image smoke
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: glyphstream:ci-smoke
          cache-from: |
            type=gha,scope=build-linux-amd64
            type=gha,scope=ci-image-smoke
          cache-to: type=gha,mode=max,scope=ci-image-smoke

      - name: Boot and smoke-test the image
        run: tests/image-smoke/run.sh glyphstream:ci-smoke

  secrets:
    name: Secret scan
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pinned by digest; bump the tag and digest together. --redact keeps a
      # real hit out of the (public) job log. --log-opts=HEAD scans the history
      # of the commit under test only: gitleaks defaults to `git log --all`,
      # and fetch-depth 0 fetches every remote branch, so a finding on some
      # stale, unrelated branch would otherwise fail every PR and block main
      # publishes over a commit that doesn't contain it. (GitHub's own secret
      # scanning still covers the whole repo.)
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --no-banner --verbose --log-opts=HEAD

  unit:
    name: Unit tests
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: pnpm

      # --ignore-scripts: pnpm blocks unapproved native-module
      # builds in CI even when pnpm-workspace.yaml's `allowBuilds` lists
      # them. Rebuild explicitly afterward — that's the documented bypass.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native modules
        run: pnpm rebuild esbuild

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native modules
        run: pnpm rebuild esbuild

      # Cache Playwright browser binaries across runs. Keyed on the
      # version string from the installed @playwright/test so the
      # cache invalidates when the package bumps; rehydrates for free
      # otherwise.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # On a cache hit, browser binaries are present but the apt-get
      # system deps might not be — install just those.
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      # On failure, attach the Playwright HTML report + traces so the
      # PR author can debug without re-running locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
