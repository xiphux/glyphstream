# Auto-merge safe Dependabot PRs once CI passes.
#
# Standalone + workflow_run on purpose: embedding this in the CI workflow made
# that (reusable) workflow request contents/pull-requests write, which exceeds
# what its callers (docker/deploy/publish) grant and invalidated the workflow.
# Running AFTER CI completes keeps write-permissions out of the CI workflow.
# It also runs from the trusted default branch, not PR code — nothing here
# checks out or executes anything from the PR.
#
# Safe = EVERY update in the PR is a semver patch, or a minor outside 0.x, or a
# 0.x minor of a package on ZERO_X_MINOR_OK (below).
# Held for manual review: majors, other 0.x minors (which can break, e.g.
# esbuild), prereleases (drizzle's RC pins), and anything whose metadata can't
# be read.
#
# ZERO_X_MINOR_OK names 0.x packages whose minors CI can actually judge, because
# a real-library test sits on the path a breaking minor would break. Adding a
# name means naming that test, here:
#   sharp                 media-thumbnail-real-sharp (every stored format),
#                         vision-variant, and the Docker image smoke (musl build)
#   esbuild               bundles the pyodide worker that
#                         pyodide-worker-integration runs; CI build; image smoke
#   linkedom              tools-fetch-url and retrieval-chunker use it for real;
#                         image smoke
#   @mozilla/readability  tools-fetch-url (real extraction); image smoke. The
#                         weakest of the four: a minor can change which text is
#                         extracted without failing anything.
#
# The verdict comes from the `updated-dependencies:` YAML block Dependabot
# writes into its commit message, not from the PR title. The title only names
# a version pair for single-dependency PRs; a grouped PR ("bump the svelte
# group with 4 updates") has none, and parsing the title held every group.
#
# That block carries `update-type` only for scheduled version updates; security
# updates omit it (every one this repo has received). For those, the bump is
# read off the body's "Bumps [name](…) from A to B." / "Updates `name` from A
# to B" line, the same fallback dependabot/fetch-metadata uses. A missing or
# ambiguous "from" (e.g. a bare `4`), a "to" that disagrees with the block's
# version, or a name listed twice with different pairs, still holds. That last
# one is real: a lockfile holding two copies of a package lists both ("from
# 3.1.10 to 4.0.8" and "from 4.0.5 to 4.0.8"), and keeping either line alone
# would call a 3 -> 4 major a patch.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge if every update is semver-safe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Space-separated, exact package names. See the header for why each.
          ZERO_X_MINOR_OK: sharp esbuild linkedom @mozilla/readability
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No PR found for $SHA"; exit 0; fi
          read -r head author < <(gh pr view "$pr" --repo "$REPO" --json headRefOid,author \
            --jq '"\(.headRefOid) \(.author.login)"')
          # CI went green on $SHA. If the branch moved since (a rebase, or a
          # human pushing a fix onto it), that verdict is for a different tree.
          if [ "$head" != "$SHA" ]; then echo "PR #$pr head moved past $SHA - skipping"; exit 0; fi
          if [ "$author" != "app/dependabot" ]; then echo "PR #$pr not opened by Dependabot ($author)"; exit 0; fi
          committer=$(gh api "repos/$REPO/commits/$SHA" --jq '.author.login // empty')
          if [ "$committer" != "dependabot[bot]" ]; then
            echo "Head commit authored by '$committer', not Dependabot - manual review"; exit 0
          fi

          # One "name|version|update-type" line per dependency. Not tabs: bash
          # treats tab as IFS whitespace and collapses a run of them, so an empty
          # version would shift the update type into `ver`.
          # The block is YAML, so Dependabot quotes any value that would
          # otherwise parse as a number: a two-part action tag like 0.6 is
          # written '0.6'. Strip quotes before the version is pattern-matched,
          # or a quoted 0.x minor slips past the `0.*` hold below.
          # A fourth field records where the update type came from, for the log.
          updates=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' | awk '
            function unquote(s) { gsub(/["\047]/, "", s); return s }
            function vstrip(s) { sub(/^v/, "", s); return s }
            # Classify A -> B by major/minor. "" (hold) unless both have
            # numeric major.minor: a bare "4" could hide a minor or a patch.
            function derive(a, b,   pa, pb) {
              if (split(vstrip(a), pa, ".") < 2 || split(vstrip(b), pb, ".") < 2) return ""
              if (pa[1] !~ /^[0-9]+$/ || pa[2] !~ /^[0-9]+$/) return ""
              if (pb[1] !~ /^[0-9]+$/ || pb[2] !~ /^[0-9]+$/) return ""
              if (pa[1] + 0 != pb[1] + 0) return "version-update:semver-major"
              if (pa[2] + 0 != pb[2] + 0) return "version-update:semver-minor"
              return "version-update:semver-patch"
            }
            # Record a body pair; a second, different pair for the same name
            # makes the name ambiguous, so it is never derived.
            function pair(n, a, b) {
              if ((n in from) && (from[n] != a || to[n] != b)) amb[n] = 1
              from[n] = a; to[n] = b
            }
            function flush(   src) {
              if (name == "") return
              src = (type == "" ? "neither metadata nor body" : "metadata")
              if (type == "" && (name in from) && !(name in amb) && vstrip(to[name]) == vstrip(ver)) {
                type = derive(from[name], to[name]); src = "body " from[name] " -> " to[name]
              }
              print name "|" ver "|" type "|" src
              name = ver = type = ""
            }
            /^updated-dependencies:/ { inblock = 1; next }
            inblock && /^\.\.\./     { inblock = 0 }
            # Body lines, outside the block: the prose version pairs.
            !inblock && /^Bumps \[[^]]+\]\([^)]*\) from [^ ]+ to [^ ]+\.$/ {
              n = $2; gsub(/^\[|\].*$/, "", n); t = $NF; sub(/\.$/, "", t); pair(n, $(NF-2), t); next
            }
            !inblock && NF == 6 && $1 == "Updates" && $3 == "from" && $5 == "to" {
              n = $2; gsub(/`/, "", n); pair(n, $4, $6); next
            }
            !inblock                 { next }
            /^- dependency-name:/    { flush(); name = unquote($3) }
            /^  dependency-version:/ { ver = vstrip(unquote($2)) }
            /^  update-type:/        { type = unquote($2) }
            END                      { flush() }
          ')
          if [ -z "$updates" ]; then echo "No updated-dependencies metadata - manual review"; exit 0; fi

          safe=yes
          while IFS='|' read -r name ver type src; do
            verdict=hold
            case "$ver" in
              '')  reason="no version recorded" ;;
              *-*) reason="prerelease" ;;
              *)
                case "$type" in
                  version-update:semver-patch) verdict=ok; reason="patch" ;;
                  version-update:semver-minor)
                    case "$ver" in
                      0.*)
                        case " $ZERO_X_MINOR_OK " in
                          *" $name "*) verdict=ok; reason="0.x minor, allowlisted" ;;
                          *)           reason="0.x minor" ;;
                        esac ;;
                      *)   verdict=ok; reason="minor" ;;
                    esac ;;
                  *) reason="${type:-unknown update type}" ;;
                esac ;;
            esac
            echo "  $name -> ${ver:-?}: $reason ($verdict; type from ${src:-?})"
            [ "$verdict" = ok ] || safe=no
          done <<<"$updates"

          if [ "$safe" = yes ]; then
            echo "PR #$pr: all updates semver-safe - merging"
            # --match-head-commit closes the window between the head check at
            # the top and this call: a push landing in between is refused by
            # GitHub rather than merged without the CI run this verdict is for.
            gh pr merge "$pr" --repo "$REPO" --merge --delete-branch --match-head-commit "$SHA"
          else
            echo "PR #$pr: holding for manual review"
          fi
