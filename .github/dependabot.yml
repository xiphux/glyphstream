# Two ecosystems, both reviewed through the same gate: dependabot-automerge.yml
# merges a PR only once CI is green AND every update in it is semver-safe (see
# that file for the rule). Anything else — a major, a 0.x minor (bar a short
# allowlist there), a prerelease — stays open for a human.
#
# Security updates are a separate repo setting (enabled), not configured here;
# `cooldown` does not delay them, and `ignore` update-types don't apply to
# them, so a security fix that needs a major still arrives as a PR.
version: 2
updates:
  # Keep GitHub Actions pins current. A pin that is never bumped goes stale
  # silently; Dependabot opens a PR whenever a used action ships a release,
  # updating the ref (and, for SHA pins, the trailing `# vX.Y.Z` comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # A hijacked action tag is usually caught and pulled within days; a week
    # keeps a fresh compromise from reaching a SHA pin automatically.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      prefix-development: deps(dev)
    # A week, not a day. pnpm 11 refuses packages younger than 24h
    # (`minimumReleaseAge`) and checks the LOCKFILE against it, so a same-day
    # release would fail `--frozen-lockfile` in CI — but the longer wait is for
    # supply-chain reasons: most malicious publishes are found and yanked
    # within days. Security updates ignore cooldown and still arrive at once.
    cooldown:
      default-days: 7
    # Packages that must move in lockstep share a PR, so CI never sees half a
    # family bumped. Groups also name the issues upgrade-check.yml opens for
    # majors. `update-types` keeps a security PR that needs a major out of a
    # group, so it arrives on its own, to be reviewed on its own.
    groups:
      svelte:
        patterns:
          - svelte
          - svelte-check
          - svelte-eslint-parser
          - eslint-plugin-svelte
          - prettier-plugin-svelte
          - '@sveltejs/*'
          - '@testing-library/svelte'
        update-types: [minor, patch]
      vite:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - tailwindcss
          - '@tailwindcss/*'
          - '@vite-pwa/*'
          - workbox-*
        update-types: [minor, patch]
      lint:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-*
          - typescript-eslint
          - '@stylistic/*'
          - globals
          - prettier
        update-types: [minor, patch]
      shiki:
        patterns:
          - shiki
          - '@shikijs/*'
        update-types: [minor, patch]
      simplewebauthn:
        patterns:
          - '@simplewebauthn/*'
        update-types: [minor, patch]
    # drizzle is upgraded by hand. It's pinned to an exact 1.0.0 RC, and
    # drizzle also publishes a snapshot build of internal branches to npm
    # (`1.0.0-rc.5-169397b`, dist-tags like `effect-fixes`). Semver ranks those
    # above the official RC, so Dependabot proposed one (#25), and that build
    # broke the relations API, blob decoding and error messages. Upgrade by
    # following the `rc` dist-tag / GitHub releases instead.
    # Revisit once 1.0.0 ships as stable. Note ignore rules also suppress
    # Dependabot security PRs for these; advisories still show in the
    # Security tab.
    ignore:
      # Majors are upgraded on purpose, by hand, not proposed weekly. Ignored
      # rather than proposed-and-held because Dependabot offers only a
      # package's newest version: a pending major would take the place of that
      # package's minor and patch updates, and each held major would occupy one
      # of the five open-PR slots. workflows/upgrade-check.yml opens an issue per
      # major instead.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: drizzle-orm
      - dependency-name: drizzle-kit
