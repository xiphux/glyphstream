# zizmor (GitHub Actions security linter) — run by the `infra` job in ci.yml.
# Every exception below is a finding that was read and judged, not silenced to
# get green. Add a new one only with the same kind of reason next to it.
rules:
  # Flags `cache: pnpm` and the Playwright browser cache because ci.yml is
  # called from docker.yml, a publishing workflow. Neither cache reaches what
  # we publish: the image installs its own dependencies from the lockfile
  # inside the Dockerfile, and nothing from the test jobs' workspace is handed
  # to `build`. A PR can only write caches into its own ref's scope, which
  # `main` and tag runs never read. (docker.yml's own buildx `type=gha` layer
  # cache does feed the image, but that workflow runs only on main + tags.) The
  # `image` smoke job builds with buildx too: it READS docker.yml's
  # build-linux-amd64 scope but WRITES only `ci-image-smoke`, which docker.yml
  # never reads, so it can't feed layers into a published image either.
  cache-poisoning:
    ignore:
      - ci.yml

  # Suggests `gh release create` over softprops/action-gh-release. A fair
  # simplification, but it would change how the release body and generated
  # notes compose, and it's style rather than risk. SHA-pinned in the meantime.
  superfluous-actions:
    ignore:
      - docker.yml

  # Suggests `uses: $/…` over `./…` for the reusable-workflow call. The `./`
  # form resolves from the caller's own commit, which ci.yml's pass-marker
  # scheme depends on; revisit once the new syntax's semantics there are
  # confirmed rather than switching a release gate on a lint hint.
  self-repository:
    ignore:
      - docker.yml
