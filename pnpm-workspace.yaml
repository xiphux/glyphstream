# pnpm settings. NOT a monorepo — there's no `packages:` list; this file
# exists because pnpm stopped reading the `pnpm` field of package.json
# (it warns and *silently ignores* the keys, which quietly dropped the
# security overrides below). This is their new home.

# Transitive-dependency floors, all security-advisory driven. These are
# not direct deps — they arrive under @modelcontextprotocol/sdk and
# friends — so a plain upgrade can't move them.
#
# `cookie` is the one that crosses a 0.x minor: @sveltejs/kit (latest 2.70.3)
# still declares ^0.6.0, and the fix (GHSA-pxg6-pf52-xh8x, out-of-bounds
# characters in cookie name/path/domain) is 0.7.0. The parse/serialize API is
# unchanged. We only set fixed cookie names, so it wasn't reachable here.
# Drop this floor once kit depends on >=0.7.
overrides:
  fast-uri: '>=4.1.3'
  ip-address: '>=10.3.1'
  hono: '>=4.13.5'
  '@hono/node-server': '>=2.0.5'
  qs: '>=6.16.0'
  cookie: '>=0.7.0'

# Install-script decisions. Replaces the old `onlyBuiltDependencies` list,
# which pnpm 11 removed; pnpm 12 additionally turns an undecided script from a
# warning into a hard ERR_PNPM_IGNORED_BUILDS, so every package carrying a hook
# needs an entry — and `false` satisfies that exactly as `true` does.
#
# sharp is dropped from this list rather than set to `false`: it gave up its
# install script at 0.33 in favour of prebuilt @img/sharp-* packages, and
# 0.35.4 is what resolves here. The entry was a permission for a script that no
# longer exists, which silently pre-approves whatever a future version adds.
#
# CI and the Docker build install with --ignore-scripts and then run
# `pnpm rebuild esbuild` explicitly (ci.yml), so this file governs local
# installs only. That rebuild is likely redundant for the same reason the entry
# below is, but it is cheap and deliberate, so it stays until someone measures
# it.
allowBuilds:
  # `node install.js`, which validates the binary and can download one. Both
  # versions in the tree (0.25.12 and 0.28.2) carry the binary in
  # @esbuild/linux-x64 and @esbuild/darwin-arm64, all four of which are pinned
  # in pnpm-lock.yaml — so the hook has nothing to fetch. Verified by blocking
  # the script and running `esbuild --version`.
  esbuild: false

# Refuse to install a dependency whose own `engines` excludes the running
# Node. Used to be `engine-strict=true` in .npmrc; pnpm 11 restricts .npmrc to
# auth and registry settings and ignores everything else, so it had to move
# here or it would have quietly stopped applying.
#
# The project's own Node floor (>=26) is NOT in package.json's `engines`, on
# purpose. It lives in `devEngines.runtime` with `onFail: warn`: Dependabot
# reads `engines.node`, compares it with the Node its updater runs (24.x as of
# 2026-09), and refuses every npm update when they disagree. It does not read
# `devEngines`, and a warning lets its pnpm run proceed. Nothing in the app
# needs 26 (the suite, build and server all pass on 24); 26 is the floor
# because it is what Docker ships and CI tests. Once Dependabot runs Node 26,
# this can move back to `engines` for a hard local error.
engineStrict: true
