# Grype (container vulnerability scanner) -- run against the published image
# by .github/workflows/image-scan.yml.
#
# Every entry below is a finding that was read and judged, not silenced to get
# green. Add one only with the same kind of reason beside it, and delete it
# once the finding stops appearing rather than leaving it to rot.

ignore:
  # npm's own bundled dependencies, as of 2026-10-26.
  #
  # The image keeps npm and npx because the documented stdio MCP setup is
  # `command = "npx"` (see the runtime stage of the Dockerfile), and npm ships
  # its dependencies inside its own package, so these come with the base image
  # (node:26-alpine, npm 11.20.0) rather than from our lockfile -- nothing here
  # can upgrade them. The newest npm releases (11.21.1 and 12.2.1) bundle undici
  # 6.29.0 and ip-address 10.7.2, still short of the fixes (6.29.1, 10.7.4), so
  # there is no npm to upgrade to either. The server never loads them: they are reached
  # only when an MCP server is configured to run through npx, which fetches a
  # package the operator chose.
  #
  # Each rule is scoped to npm's directory, so the same advisory in a package
  # the app ships is still reported. Delete these once a node:26-alpine image
  # bundles an npm with fixed versions; the scan will report nothing for them
  # then.
  - vulnerability: GHSA-rfgv-xxqx-mfg5
    package: { name: undici, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-3wwx-pv8p-q78v
    package: { name: undici, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-r53p-7pc4-xj5r
    package: { name: undici, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-6j4f-fj2g-mc7p
    package: { name: brace-expansion, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-qhr7-859c-m2p7
    package: { name: brace-expansion, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-q2hr-2g5m-vwhr
    package: { name: brace-expansion, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-h3mg-xc3c-68pw
    package: { name: ip-address, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-j6r3-76f7-8jcv
    package: { name: ip-address, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-rpw4-54j3-4h4q
    package: { name: ip-address, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-2vr4-cq9g-pvrc
    package: { name: ip-address, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-xjj6-f33q-929c
    package: { name: undici, location: /usr/local/lib/node_modules/npm/** }
  - vulnerability: GHSA-4qv8-2p9j-2685
