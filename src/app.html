		<!-- viewport-fit=cover gives content access to the iOS safe-area insets,
			 which we then opt back out of in component CSS where needed. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- Resolve the color scheme before first paint (no FOUC). Reads the
			 gs-scheme cookie (mirror of the user's pref): 'light'/'dark' force
			 that scheme; anything else ('system'/absent) follows the OS. Dark
			 mode keys off this data-scheme attribute — see app.css. -->
		<script>
			(function () {
				try {
					var m = document.cookie.match(/(?:^|;\s*)gs-scheme=([^;]+)/);
					var pref = m ? m[1] : 'system';
					var dark =
						pref === 'dark' ||
						(pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
				} catch (e) {
					/* leave unset → CSS falls back to light */
				}
			})();
			// Frosted glass needs a GPU that actually renders backdrop-filter
			// blur; integrated GPUs (e.g. Intel on Windows) often don't, where
			// the low-opacity frost just bleeds content through. @supports
			// can't tell — it's syntax-only — so probe the real GPU via the
			// WebGL renderer string and only opt INTO the glassy low-opacity
			// (data-blur="rich") for GPUs known to frost well. Anything
			// unknown/masked stays on the readable default. Cached in a cookie
			// so the WebGL probe runs at most once.
			// The COOKIE read stays inline and synchronous — it's a string match, and
			// applying `data-blur` before first paint is what avoids a FOUC on every
			// repeat visit. The WebGL PROBE does not: acquiring a WebGL context costs
			// ~10-30ms on desktop and 50-100ms+ on mobile, where the GPU process may
			// have to spin up, and it ran before the SvelteKit head placeholder at the
			// end of this <head> on the one load where nothing else is cached either.
			// Deferred to idle: the only cost is that the very first visit ever paints
			// in the readable default style for a frame before upgrading, and the
			// default is the safe one anyway.
			// NB: never write that placeholder's literal token above where it actually
			// belongs. Kit substitutes the template with a single string .replace, so
			// the FIRST occurrence wins — a mention in a comment swallows the head and
			// leaves the real tag to render as visible text at the top of every page.
			(function () {
				function apply(blur) {
					if (blur === 'rich') document.documentElement.dataset.blur = 'rich';
				}
				function probe() {
					try {
						var cv = document.createElement('canvas');
						var gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
						var rich = false;
						if (gl) {
							var dbg = gl.getExtension('WEBGL_debug_renderer_info');
							if (dbg) {
								var r = String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '').toLowerCase();
								rich = /apple|nvidia|geforce|rtx|gtx|radeon rx|radeon pro/.test(r);
							}

						var blur = rich ? 'rich' : 'plain';
						document.cookie = 'gs-blur=' + blur + '; path=/; max-age=31536000; samesite=lax';
						apply(blur);
					} catch (e) {
						/* leave unset → readable default */
					}
				}
				try {
					var c = document.cookie.match(/(?:^|;\s*)gs-blur=([^;]+)/);
					if (c) {
						apply(c[1]);
					} else if (window.requestIdleCallback) {
						window.requestIdleCallback(probe, { timeout: 3000 });
					} else {
						setTimeout(probe, 300);
					}
				} catch (e) {
					/* leave unset → readable default */
				}
			})();

		<!-- iOS PWA-specific hints. iOS honors SVG for neither apple-touch-icon
			 nor the manifest icons, so the home-screen icon needs a raster PNG —
			 without one iOS falls back to a screenshot of the page. Full-bleed
			 (no rounded corners); iOS applies its own squircle mask. The LAUNCH
			 image is a separate mechanism entirely — see the splash block
			 below; a PNG icon does not get you one. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- black-translucent renders the app edge-to-edge BEHIND the status bar,
			 so the bar takes on the app's own colors (a themed status bar iOS
			 otherwise won't let us set — it ignores theme-color for the
			 standalone bar). Its one famous footgun: in standalone the view is
			 offset up by the status-bar height (~59px) WITHOUT the viewport
			 growing, so a shell sized with 100dvh/100% comes up short and leaves
			 the intermittent "chin gap" at the bottom. The fix is to size the app
			 shell with 100vh (the full physical viewport) in standalone — see
			 .app-shell in app.css. Do NOT switch this to default/black to "fix"
